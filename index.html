<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Experiments</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        box-sizing: border-box;
        max-width: 52rem;
        min-height: 100vh;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }

      h1 {
        margin-top: 0;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 0.75rem;
        padding: 0;
        list-style: none;
      }

      a {
        display: block;
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 0.75rem;
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Web Experiments</h1>
      <ul>
        <li><a href="./ants/">Ants</a></li>
        <li><a href="./first/">First</a></li>
        <li><a href="./flyer/">Flyer</a></li>
        <li><a href="./jewelthief/">Jewel Thief</a></li>
        <li><a href="./oliviaforest/">Olivia Forest</a></li>
        <li><a href="./peerliointegration/">Peerlio Integration</a></li>
        <li><a href="./robot/">Robot</a></li>
        <li><a href="./sandcastle/">Sandcastle</a></li>
        <li><a href="./second/">Second</a></li>
        <li><a href="./worldeater/">World Eater</a></li>
      </ul>
    </main>
  </body>
</html>
