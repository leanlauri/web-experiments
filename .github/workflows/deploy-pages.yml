name: Deploy all web experiments to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Vite projects
        shell: bash
        run: |
          set -euo pipefail

          for project_path in */; do
            project="${project_path%/}"
            if [[ ! -f "$project/package.json" ]]; then
              continue
            fi

            echo "Building $project"
            if [[ -f "$project/package-lock.json" ]]; then
              npm ci --prefix "$project" --no-audit --no-fund
            else
              npm install --prefix "$project" --no-audit --no-fund
            fi
            npm run build --prefix "$project"
          done

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          site="${RUNNER_TEMP}/pages-site"
          mkdir -p "$site"
          cp index.html "$site/index.html"

          for project_path in */; do
            project="${project_path%/}"
            destination="$site/$project"

            if [[ -f "$project/package.json" ]]; then
              if [[ ! -d "$project/dist" ]]; then
                echo "Missing build output for $project" >&2
                exit 1
              fi
              mkdir -p "$destination"
              cp -R "$project/dist/." "$destination/"
            elif [[ -f "$project/index.html" ]]; then
              mkdir -p "$destination"
              cp -R "$project/." "$destination/"
            fi
          done

          touch "$site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
